[project]
name = "portal"
version = "1.0.0"
description = "AUGSD Portal - Timetable Generation and Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.30.0",
    "bcrypt>=4.2.0",
    "click>=8.3.1",
    "fastapi>=0.115.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.12.5",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "rich>=14.2.0",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.34.0",
    "greenlet>=3.2.4",
    "requests>=2.32.5",
    "reportlab>=4.4.5",
    "xlsxwriter>=3.2.9",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["ruff>=0.11.0", "pytest>=8.3.0", "pytest-asyncio>=0.25.0"]


[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]  # Allow forward references in SQLAlchemy models
"app/schemas/*.py" = ["F821"] # Allow forward references in Pydantic schemas

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
